<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
  <title>FluxDrop — Offline</title>
  <meta name="theme-color" content="#0b1512" />
  <link rel="icon" href="/logo.svg" type="image/svg+xml" />
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(16, 185, 129, 0.14), transparent),
        #0b1512;
      color: #e7f0ec;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      max-width: 420px;
      width: 100%;
      text-align: center;
      padding: 40px 32px;
      border-radius: 20px;
      border: 1px solid rgba(16, 185, 129, 0.18);
      background: rgba(255, 255, 255, 0.03);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }
    .bolt {
      width: 64px; height: 64px;
      margin: 0 auto 20px;
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #10b981, #14b8a6);
      box-shadow: 0 8px 30px rgba(16, 185, 129, 0.35);
    }
    .bolt svg { width: 34px; height: 34px; }
    h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 10px; }
    p { font-size: 14px; line-height: 1.6; color: #9fb8ad; margin-bottom: 26px; }
    .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #f59e0b; margin-right: 7px; vertical-align: 1px; }
    button {
      appearance: none; border: 0; cursor: pointer;
      font: inherit; font-weight: 600; font-size: 14px;
      color: #ffffff;
      background: linear-gradient(135deg, #059669, #0d9488);
      padding: 12px 28px; border-radius: 12px;
      box-shadow: 0 4px 16px rgba(16, 185, 129, 0.3);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    button:hover { transform: translateY(-1px); box-shadow: 0 6px 22px rgba(16, 185, 129, 0.4); }
    button:active { transform: translateY(0); }
    .hint { margin-top: 20px; font-size: 12px; color: #6f8a7e; }
    .hint code { font-family: ui-monospace, monospace; font-size: 11px; background: rgba(255,255,255,0.06); padding: 2px 6px; border-radius: 5px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="bolt" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z" fill="#ffffff" stroke="none"/>
      </svg>
    </div>
    <h1>You&rsquo;re offline</h1>
    <p>
      <span class="dot" aria-hidden="true"></span>FluxDrop can&rsquo;t reach the network right now.<br />
      Your transfers and history are safe on this device —
      reconnect and try again.
    </p>
    <button id="retry" type="button">Reconnect</button>
    <p class="hint">Transfers run peer-to-peer over WebRTC — but the initial handshake still needs a connection. File data never touches a server.</p>
  </main>
  <script>
    document.getElementById('retry').addEventListener('click', function () {
      location.reload()
    })
    window.addEventListener('online', function () { location.reload() })
  </script>
</body>
</html>
